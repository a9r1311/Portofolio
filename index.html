        <script src="https://cdnjs.cloudflare.com/ajax/libs/luminous-lightbox/2.3.2/luminous.min.js">

    window.addEventListener('scroll', function() {
        const scrollTop = window.scrollY;
        const maxScroll = 1500;
        
        // スクロール率（0から1の範囲に収める）
        let progress = scrollTop / maxScroll;
        if (progress > 1) progress = 1;
        
        // 【演出のロジック】
        // スクロール前半（progress: 0 → 0.5）で線がどんどん太くなり画面を埋める
        // スクロール後半（progress: 0.5 → 1.0）でさらに太くなるか、または細くなって消える
        
        let lineWidth;
        let spacing = 50; // 線の間隔
        
        if (progress <= 0.5) {
            // 前半：線が太くなっていく（初期10pxから最大25px、あるいは隙間を埋める）
            // 隙間をなくして完全にベタ塗りにする計算
            let factor = progress * 2; // 0 〜 1
            lineWidth = 10 + (factor * 40); // 太さが変化
        } else {
            // 後半：さらにスクロールすると、今度は逆に線が細くなって消えていく
            let factor = (progress - 0.5) * 2; // 0 〜 1
            lineWidth = 50 - (factor * 50); // 太さが50から0に向かって細くなる
        }

        // CSSのグラデーションを動的に書き換える
        const overlay = document.getElementById('diagonal-overlay');
        overlay.style.background = `
            repeating-linear-gradient(
                45deg,
                transparent,
                transparent ${spacing - lineWidth}px,
                #ff1010 ${spacing - lineWidth}px,
                #ff1010 ${spacing}px
            )
        `;
    });
    </script>

<script>
class SmoothSteppedSlider {
    constructor(containerId, trackId, options = {}) {
        this.container = document.getElementById(containerId);
        this.track = document.getElementById(trackId);
        
        this.itemWidth = options.itemWidth || 450; 
        this.gap = options.gap || 40;              
        this.stepSize = this.itemWidth + this.gap; 
        this.currentIndex = 0;
        
        this.totalOriginalItems = 4;
        this.maxScroll = this.stepSize * this.totalOriginalItems;
        
        this.intervalTime = options.intervalTime || 3000; 
        this.animDuration = options.animDuration || 700;   
        
        this.currentX = 0;
        this.targetX = 0;
        
        this.init();
    }

    init() {
        this.timer = setInterval(() => {
            this.nextStep();
        }, this.intervalTime);
    }

    nextStep() {
        this.currentIndex++;
        this.targetX = -this.currentIndex * this.stepSize;
        
        this.animateToTarget();

        if (this.currentIndex >= this.totalOriginalItems) {
            setTimeout(() => {
                this.track.style.transition = 'none'; 
                this.currentIndex = 0;
                this.currentX = 0;
                this.targetX = 0;
                this.track.style.transform = `translateX(0px)`;
                
                void this.track.offsetHeight;
                this.track.style.transition = `transform ${this.animDuration}ms cubic-bezier(0.25, 1, 0.5, 1)`;
            }, this.animDuration);
        }
    }

    animateToTarget() {
        this.track.style.transition = `transform ${this.animDuration}ms cubic-bezier(0.25, 1, 0.5, 1)`;
        this.track.style.transform = `translateX(${this.targetX}px)`;
        this.currentX = this.targetX;
    }
}

window.addEventListener('DOMContentLoaded', () => {
    new SmoothSteppedSlider('sliderContainer', 'sliderTrack', {
        intervalTime: 3000, 
        animDuration: 700    
    });
});
</script>
